name: Test
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: The fully-formed ref of the branch or tag that triggered the workflow run
        required: false
        type: string
      sha:
        description: The sha of the commit that triggered the workflow run
        required: false
        type: string
jobs:
  screenshot:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Run this composite action
        id: screenshot
        uses: ./ # Use the path to your action directory
        with:
          # Your action's inputs
          url: "file://${{github.workspace}}/test/html/index.html"
          output: "docs/example.png"
          css: |
            body {
              background: rgb(2,0,36);
              background: linear-gradient(139deg, rgba(2,0,36,1) 0%, rgba(9,9,121,1) 56%, rgba(147,0,255,1) 100%);
            }
          customizations: "\"#name\": \"${{ github.event.repository.name }} \U0001F4F7\"\n"
          viewportWidth: 2000
          viewportHeight: 800
      - name: Comment screenshot on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: image/png" \
            --data-binary "@${{ steps.screenshot.outputs.file }}" \
            "https://uploads.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/assets?name=screenshot.png")
          IMAGE_URL=$(echo "$RESPONSE" | jq -r '.browser_download_url')
          echo "## Generated Screenshot" >> $GITHUB_STEP_SUMMARY
          echo "![Generated Screenshot](${IMAGE_URL})" >> $GITHUB_STEP_SUMMARY
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "## Generated Screenshot 📷

          ![screenshot](${IMAGE_URL})"
